name: Simple Cloud Browser RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

    - name: Enable RDP
      shell: powershell
      run: |

        Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0

        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        Restart-Service TermService -Force

        Write-Host "RDP Enabled"


    - name: Remove Extra Apps And Cleanup
      shell: powershell
      run: |

        Write-Host "Removing extra apps..."

        $apps = @(
          "*3DViewer*",
          "*Bing*",
          "*Clipchamp*",
          "*Cortana*",
          "*GetHelp*",
          "*Getstarted*",
          "*MicrosoftSolitaireCollection*",
          "*MixedReality*",
          "*OfficeHub*",
          "*OneNote*",
          "*People*",
          "*PowerAutomate*",
          "*Skype*",
          "*Teams*",
          "*Todos*",
          "*WindowsAlarms*",
          "*WindowsCamera*",
          "*WindowsMaps*",
          "*WindowsSoundRecorder*",
          "*Xbox*",
          "*YourPhone*",
          "*Zune*"
        )


        foreach ($app in $apps) {

          Get-AppxPackage -AllUsers $app |
          Remove-AppxPackage -ErrorAction SilentlyContinue

        }


        Remove-Item "C:\Windows\Temp\*" `
        -Recurse `
        -Force `
        -ErrorAction SilentlyContinue


        Remove-Item "$env:TEMP\*" `
        -Recurse `
        -Force `
        -ErrorAction SilentlyContinue


        Write-Host "Cleanup Done"


    - name: Create User
      shell: powershell
      run: |

        $password = ConvertTo-SecureString `
        "Cloud@2026" `
        -AsPlainText `
        -Force


        if (-not (Get-LocalUser -Name "clouduser" -ErrorAction SilentlyContinue)) {

          New-LocalUser `
          -Name "clouduser" `
          -Password $password `
          -PasswordNeverExpires `
          -AccountNeverExpires

        }


        Add-LocalGroupMember `
        -Group "Administrators" `
        -Member "clouduser" `
        -ErrorAction SilentlyContinue


        Add-LocalGroupMember `
        -Group "Remote Desktop Users" `
        -Member "clouduser" `
        -ErrorAction SilentlyContinue


        Write-Host "User Ready"


    - name: Install Chrome
      shell: powershell
      run: |

        Invoke-WebRequest `
        "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
        -OutFile "C:\chrome.exe"


        Start-Process `
        "C:\chrome.exe" `
        -ArgumentList "/silent /install" `
        -Wait


        Remove-Item "C:\chrome.exe" -Force


        Write-Host "Chrome Installed"


    - name: Install Tailscale
      shell: powershell
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

      run: |

        Invoke-WebRequest `
        "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
        -OutFile "C:\tailscale.msi"


        Start-Process `
        msiexec.exe `
        -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
        -Wait


        $ts="C:\Program Files\Tailscale\tailscale.exe"


        & $ts up `
        --authkey="$env:TAILSCALE_AUTHKEY" `
        --hostname="cloud-browser"


        Write-Host "Tailscale Connected"


    - name: Show Login Info
      shell: powershell
      run: |

        Start-Sleep -Seconds 5


        $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4


        Write-Host "=============================="
        Write-Host "SERVER READY"
        Write-Host "IP: $ip"
        Write-Host "USERNAME: clouduser"
        Write-Host "PASSWORD: Cloud@2026"
        Write-Host "=============================="


    - name: Keep Alive
      shell: powershell
      run: |

        while ($true) {

          Write-Host "Server Running..."

          Start-Sleep -Seconds 300

        }
